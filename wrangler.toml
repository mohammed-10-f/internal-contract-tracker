name = "internal-contract-tracker"
main = "src/worker.js"
compatibility_date = "2026-08-12"
workers_dev = true
account_id = "b1e41da21e7671a9c76745f82207d68a"

# ضع هنا معرّف قاعدة D1 الحقيقية من Cloudflare.
# لا تستخدم اسم القاعدة أو أي UUID تجريبي.
[[d1_databases]]
binding = "DB"
database_name = "internal-contract-tracker-db"
database_id = "291a956f-045d-4d2e-ace5-6cf83b3f6690"

[assets]
directory = "./public"
binding = "ASSETS"
